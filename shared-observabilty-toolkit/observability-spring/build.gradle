plugins {
    id("java")
}

group = "com.pragma.observability"
version = "1.0-SNAPSHOT"

repositories {
    mavenCentral()
}

dependencies {
    implementation project(':observability-api')

    implementation 'org.slf4j:slf4j-api:2.0.16'
    implementation 'net.logstash.logback:logstash-logback-encoder:7.4'

    implementation 'io.micrometer:micrometer-tracing-bridge-otel:1.3.4'
    implementation 'io.opentelemetry:opentelemetry-exporter-otlp:1.43.0'

    implementation 'org.springframework.boot:spring-boot-autoconfigure:3.5.4'
    compileOnly 'org.springframework:spring-webflux:6.2.4' // solo para WebFilter API
}

tasks.test {
    useJUnitPlatform()
}